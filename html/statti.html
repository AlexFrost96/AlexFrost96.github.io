<!DOCTYPE html>
<html lang="ua">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Статті про алюмінієве та безрамне скління | Поради експертів ВИД</title>
  <meta name="description" content="Корисні матеріали про вибір вікон та безрамних систем. Порівняння металопластикових та алюмінієвих конструкцій.">

  <!-- Data & Layout Engine -->
  <script src="../js/site-data.js" defer></script>
  <script src="../js/layout.js" defer></script>
</head>

<body>

  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h1 class="mt-3 mt-5 h2">Статті</h1>
        <hr>
      </div>
    </div>
  </div>

  <div id="articles-container">
    <!-- Dynamically populated articles list -->
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const container = document.getElementById('articles-container');
      const articles = window.SITE_DATA ? window.SITE_DATA.articles : [];
      
      container.innerHTML = articles.map((art, index) => `
        <div class="container ${index === 0 ? 'mt-3' : 'my-5'}">
          <div class="row d-flex justify-content-start align-items-center">
            <div class="col-md-6">
              <p class="h3">${art.title}</p>
              <p class="lead">${art.description}</p>
              <a href="${art.link}" class="btn btn-secondary mb-3">Читати</a>
            </div>
            <div class="col-md-6 text-center">
              <img src="${art.img}" width="90%" alt="${art.title}" class="rounded">
            </div>
          </div>
        </div>
      `).join('');
    });
  </script>

</body>

</html>
