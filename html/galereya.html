<!DOCTYPE html>
<html lang="ua">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Галерея робіт: засклення балконів та терас у Київській області | ВИД</title>
  <meta name="description" content="Дивіться фото та відео наших проектів безрамного скління у Києві та Білій Церкві. Реальні об'єкти, висока якість виконання.">

  <!-- Data & Layout Engine -->
  <script src="../js/site-data.js" defer></script>
  <script src="../js/layout.js" defer></script>
</head>

<body>

  <div class="container">
    <div class="row">
      <div class="col-12">
        <h1 class="mt-3 mt-5 h2">Галерея</h1>
        <hr>
        <p class="text-left lead">
          Колекція наших найкращих робіт, де представлені фото з монтажем: вікон, балконів, дверей, алюмінієвих
          конструкцій, теплих відкосів, скляних конструкцій, розсувних дверей та багато іншого.
        </p>
        <ul class="nav nav-tabs" role="tablist">
          <li class="nav-item">
            <a class="nav-link active" data-toggle="tab" href="#photo" role="tab">Фото</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-toggle="tab" href="#video" role="tab">Відео</a>
          </li>
        </ul>
        <!-- Tab panes -->
        <div class="tab-content">
          <div class="tab-pane active" id="photo" role="tabpanel">
            <div class="col-md-12 d-flex justify-content-md-around flex-wrap mt-3 gallery" id="photo-grid">
              <!-- Dynamically populated photos -->
            </div>
          </div>
          <div class="tab-pane" id="video" role="tabpanel">
            <div class="col-md-12 d-flex flex-wrap my-3 gallery" id="video-grid">
              <!-- Dynamically populated videos -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // 1. Render Photos
      const photoGrid = document.getElementById('photo-grid');
      const photos = window.SITE_DATA ? window.SITE_DATA.gallery.photos : [];
      
      photoGrid.innerHTML = photos.map(photo => `
        <a data-fancybox="gallery" href="${photo.href}">
          <img data-src="${photo.src}" alt="${photo.alt}" class="lazyload" width="293" height="213">
        </a>
      `).join('');

      // 2. Render Videos
      const videoGrid = document.getElementById('video-grid');
      const videos = window.SITE_DATA ? window.SITE_DATA.gallery.videos : [];
      
      videoGrid.innerHTML = videos.map(video => `
        <div class="col-md-4 mb-3">
          <div class="embed-responsive embed-responsive-16by9">
            <iframe width="100%" height="213" src="${video.src}"
              title="${video.title}" frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
          </div>
        </div>
      `).join('');
    });
  </script>

</body>

</html>
